name: Voice AI Agent CI Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install locked backend and test dependencies
        run: uv sync --locked --extra dev
      - name: Run all isolated backend tests
        run: uv run --locked --extra dev python -m pytest -q
      - name: Build and verify installed wheel
        run: |
          uv build
          uv run --locked --extra dev python scripts/verify_release.py wheel dist/voice_agent-0.1.0-py3-none-any.whl

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile TypeScript and build frontend
        working-directory: frontend
        run: npm run build

  docker-verification:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Build release image
        run: docker build --file Dockerfile --tag voice-agent:ci .
      - name: Inspect image and smoke-test frontend, API, and WebSocket
        run: python scripts/verify_release.py image voice-agent:ci
