[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice AI Agent with Deepgram, Groq, LangGraph, Composio, and Neon PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "deepgram-sdk>=3.7.0",
    "groq>=0.11.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "composio==0.20.0",
    "composio-langchain==0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["voice-agent"]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
"app.realtime" = ["playground.html"]

[tool.pytest.ini_options]
testpaths = ["voice-agent/tests"]
pythonpath = ["voice-agent"]
addopts = "--import-mode=importlib --strict-markers -ra"
required_plugins = ["pytest-asyncio>=0.24"]
markers = [
    "asyncio: mark test as asyncio coroutine",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
